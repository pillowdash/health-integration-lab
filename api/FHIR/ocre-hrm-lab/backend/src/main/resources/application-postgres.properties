
# OCRE Lab - PostgreSQL persistence profile

spring.datasource.url=jdbc:postgresql://ocre-postgres:5432/ocre_lab
spring.datasource.username=ocre_lab
spring.datasource.password=${OCRE_DB_PASSWORD}

# Flyway CLI already manages the database schema
spring.flyway.enabled=false

# Hibernate verifies the schema rather than changing it
spring.jpa.hibernate.ddl-auto=validate

# Manage lazy-loading within service transactions
spring.jpa.open-in-view=false

# Useful SQL diagnostics during development
spring.jpa.show-sql=false

